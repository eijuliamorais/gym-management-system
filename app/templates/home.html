<!DOCTYPE html>
<html>
<head>
    <title>No Pain Gym</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h1 class="mb-4">Dashboard - No Pain Gym</h1>

    <div class="row">

        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h3>{{ total_alunos }}</h3>
                    <p>Alunos</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h3>{{ total_planos }}</h3>
                    <p>Planos</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h3>{{ total_pagamentos }}</h3>
                    <p>Pagamentos</p>
                </div>
            </div>
        </div>

    </div>

    <div class="mt-4">
        <a href="/alunos/" class="btn btn-primary">
            Gerenciar Alunos
        </a>

        <a href="{% url 'logout' %}" class="btn btn-danger">
            Sair
        </a>
    </div>

</div>

</body>
</html>
