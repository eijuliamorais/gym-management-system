{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Planos</h1>
    <a href="{% url 'criar_plano' %}" class="btn btn-primary">+ Novo Plano</a>
</div>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Nome</th>
            <th>Preço</th>
            <th>Duração (meses)</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for plano in planos %}
        <tr>
            <td>{{ plano.nome }}</td>
            <td>{{ plano.preco }}</td>
            <td>{{ plano.duracao_meses }}</td>
            <td>
                <a href="{% url 'editar_plano' plano.id %}" class="btn btn-sm btn-warning">Editar</a>
                <a href="{% url 'excluir_plano' plano.id %}" class="btn btn-sm btn-danger">Excluir</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="text-center">Nenhum plano cadastrado.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
