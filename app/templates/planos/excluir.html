{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="card-header bg-danger text-white">
        <h3>Confirmar exclusão</h3>
    </div>
    <div class="card-body">
        <p>Tem certeza que deseja excluir o plano <strong>{{ plano.nome }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sim, excluir</button>
            <a href="{% url 'listar_planos' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
