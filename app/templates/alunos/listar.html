<h1>Alunos</h1>

<a href="{% url 'criar_aluno' %}">Novo aluno</a>

<table border="1">
    <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Ações</th>
    </tr>

    {% for aluno in alunos %}
    <tr>
        <td>{{ aluno.nome }}</td>
        <td>{{ aluno.email }}</td>
        <td>
            <a href="{% url 'editar_aluno' aluno.id %}">Editar</a>
            <a href="{% url 'excluir_aluno' aluno.id %}">Excluir</a>
        </td>
    </tr>
    
    {% endfor %}
</table>
