{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm border-danger">

            <div class="card-header bg-danger text-white">
                <h3 class="mb-0">Excluir Aluno</h3>
            </div>

            <div class="card-body">

                <p class="fs-5">
                    Tem certeza que deseja excluir o aluno:
                    <strong>{{ aluno.nome }}</strong>?
                </p>

                <form method="post">

                    {% csrf_token %}

                    <button type="submit"
                            class="btn btn-danger">
                        Excluir
                    </button>

                    <a href="{% url 'listar_alunos' %}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
