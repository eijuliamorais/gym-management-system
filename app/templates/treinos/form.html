{% extends 'base.html' %}

{% block content %}
<h1>{% if form.instance.pk %}Editar{% else %}Novo{% endif %} Treino</h1>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        {{ form.as_p }}
    </div>
    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="{% url 'listar_treinos' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
