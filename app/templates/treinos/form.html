{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-header bg-dark text-white">
                <h3 class="mb-0">
                    {% if form.instance.pk %}
                        Editar Treino
                    {% else %}
                        Novo Treino
                    {% endif %}
                </h3>
            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        {{ form.nome }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        {{ form.descricao }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Instrutor</label>
                        {{ form.instrutor }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Modalidade</label>
                        {{ form.modalidade }}
                    </div>

                    <div class="mt-4">

                        <button type="submit" class="btn btn-primary">
                            Salvar
                        </button>

                        <a href="{% url 'listar_treinos' %}"
                           class="btn btn-secondary">
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
