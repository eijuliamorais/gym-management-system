{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Pagamentos</h1>
    <a href="{% url 'criar_pagamento' %}" class="btn btn-primary">+ Novo Pagamento</a>
</div>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Aluno</th>
            <th>Valor</th>
            <th>Data</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for pag in pagamentos %}
        <tr>
            <td>{{ pag.aluno.nome }}</td>
            <td>{{ pag.valor }}</td>
            <td>{{ pag.data_pagamento }}</td>
            <td>{{ pag.status }}</td>
            <td>
                <a href="{% url 'editar_pagamento' pag.id %}" class="btn btn-sm btn-warning">Editar</a>
                <a href="{% url 'excluir_pagamento' pag.id %}" class="btn btn-sm btn-danger">Excluir</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5" class="text-center">Nenhum pagamento registrado.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
