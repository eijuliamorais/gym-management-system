{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-header bg-dark text-white">
                <h3 class="mb-0">
                    {% if form.instance.pk %}
                        Editar Pagamento
                    {% else %}
                        Novo Pagamento
                    {% endif %}
                </h3>
            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Aluno</label>
                        {{ form.aluno }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Valor</label>
                        {{ form.valor }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Data do Pagamento</label>
                        {{ form.data_pagamento }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        {{ form.status }}
                    </div>

                    <div class="mt-4">

                        <button type="submit" class="btn btn-primary">
                            Salvar
                        </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
